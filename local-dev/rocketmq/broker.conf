# 本地开发用 RocketMQ Broker 配置
#
# 用途：给 docker-compose.yml 里的 rmq-broker 服务挂载使用，让跑在 Docker 里的
# broker 对外（也就是对本机直接运行的 gateway/aggregation-service Java 进程）
# 广播一个它们真正能连上的地址，而不是 Docker 内部网络的容器IP。
#
# 背景（RocketMQ 在 Docker 里的经典坑）：客户端（本机Java进程）先连 NameServer
# (127.0.0.1:9876，已通过端口映射暴露)，NameServer 会把它所知道的 broker 地址
# 告诉客户端，然后客户端再直接去连那个地址收发消息——如果 broker 没有显式配置
# brokerIP1，它注册给 NameServer 的会是容器在 Docker 网络里的内部IP
# （类似172.x.x.x），本机进程根本连不到。显式把 brokerIP1 设成 127.0.0.1，
# 再在 compose 里把 broker 监听的端口（10909/10911/10912）原样映射到宿主机
# 对应端口，本机进程连 127.0.0.1:10911 时就能通过端口映射正确落到容器里。
#
# 这个配置只适合"docker跑中间件 + 本机跑Java应用"这种本地开发场景，
# 不代表真实生产部署方式。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 本机开发：客户端（本机Java进程）通过这个地址回连broker，配合compose端口映射
brokerIP1 = 127.0.0.1

# 单机开发用异步刷盘+异步复制，不追求数据可靠性，只追求能跑起来
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 默认端口，与 compose 里的端口映射保持一致
listenPort = 10911

# 自动创建Topic，方便本地开发直接收发，不用提前手动建Topic
autoCreateTopicEnable = true

deleteWhen = 04
fileReservedTime = 48
